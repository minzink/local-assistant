# Beispielkonfiguration – nach cassi.yaml kopieren und anpassen (cassi.yaml ist gitignored).
# Alle Werte sind optional; nicht gesetzte Werte nutzen die Standardwerte.

language:
  default: de          # de | en
  auto_detect: true    # Sprache pro Äußerung erkennen und in derselben Sprache antworten

input:
  mode: push_to_talk   # push_to_talk (Taste halten) | continuous (immer zuhören)
  continuous:
    end_silence_ms: 600  # so lange Pause beendet einen Satz
    barge_in: true       # Cassi per Sprache unterbrechen – nur mit Headset, sonst hört es sich selbst
  trigger: hotkey       # hotkey (Taste halten) | terminal (Enter startet/stoppt)
  # push_to_talk_key: alt_r   # Standard: alt_r (rechte Option) auf macOS, ctrl_r auf Windows

audio:
  input_device: null   # null = Systemstandard, sonst Name oder Index
  output_device: null
  vad: true            # Stille abschneiden, Aufnahmen ohne Sprache verwerfen (Silero VAD)

stt:
  backend: parakeet    # parakeet (schnell) | auto = Whisper (genauer, ~0,6 s) | mlx-whisper | faster-whisper
  model: large-v3-turbo  # nur für Whisper

llm:
  backend: openai-compatible
  # Jeder Server mit OpenAI-kompatibler API, z.B.:
  #   Ollama     http://127.0.0.1:11434/v1
  #   LM Studio  http://localhost:1234/v1   (MLX-Engine auf Apple Silicon)
  #   llama.cpp  http://localhost:8080/v1   (llama-server)
  #   mlx-lm     http://localhost:8080/v1   (mlx_lm.server)
  base_url: http://127.0.0.1:11434/v1
  api_key: null
  model: qwen3-vl:8b-instruct           # Apache-2.0; Text, Bilder, Tools; ohne Denk-Modus
  input_modalities: [text, image]       # [text] für reine Textmodelle (dann kein Bildschirm)
  temperature: 0.7
  max_tokens: 400
  context_tokens: 8192                  # längere Anfragen kürzt Cassi vorher (älteste Nachrichten zuerst); 0 = nie
  keep_warm_minutes: 4                  # Modell warm halten (Ollama entlädt nach 5 min); 0 = aus
  structured_routing: false             # Aktionen per Formular (JSON-Schema) – mit qwen3-vl nicht besser
  classify_requests: true               # ungewöhnlich formulierte Rechner-Bitten vom Modell einordnen (~0,4 s)
  shared_prefix_routing: true           # Weiterleitung mit dem Gesprächsprompt (Antwort danach aus dem Cache)
  rewarm: true                          # Gesprächsanfang nach jeder Runde im Leerlauf wieder in den Cache
  thinking:                             # Denken nur auf Wunsch („denk mal nach“), vorher „Moment …“
    enabled: false
    model: null                         # z.B. qwen3-vl:8b-thinking (Apache 2.0): 100 % statt 75 %
                                        # bei Rechen-/Logikfragen, 7–30 s; Ollama-Kontext 8k
    extra_body: {}                      # z.B. {chat_template_kwargs: {enable_thinking: true}}
    max_tokens: 2000
  extra_body: {}                        # Server-spezifische Felder je Anfrage, z.B. llama.cpp +
                                        # Qwen3.5: {chat_template_kwargs: {enable_thinking: false}}

tts:
  backend: auto        # auto: qwen3 auf Apple Silicon, sonst piper (qwen3 mit PyTorch ist langsam)
  voice:               # qwen3: eine Stimme für Deutsch und Englisch
    name: auto         # auto | own (cassi voice record) | ramona | hokuspokus | thorsten | Pfad.wav
    pitch: 0           # Halbtöne, z.B. -2 tiefer, 2 höher (auch für piper)
    speed: 1.0         # 1.2 = 20 % schneller (auch für piper)
  voices:              # piper: je Sprache eine Stimme; Ramona (voices/) spricht beide wie qwen3
    de: cassi-ramona-medium     # fehlt sie (git lfs pull), spricht Kerstin (CC0); männlich: de_DE-thorsten-medium
    en: cassi-ramona-medium     # fehlt sie, spricht Kristin (gemeinfrei)
  filler:              # kurzes „Mhm.“, solange die Antwort noch vorbereitet wird
    enabled: true
    delay_ms: 1200     # nur wenn so lange nach Sprechende noch nichts gesprochen wird
    # Antworten beginnen mit einem kurzen ersten Satz des Modells statt mit „Hm“.
    # phrases:         { de: ["Mhm.", "Okay."], en: [...] }   # trotzdem Füllwörter bei Antworten
    # action_phrases:  { de: ["Moment.", "Einen Moment."], en: [...] }   # bei Aktionen

persona:
  name: Cassi
  # system_prompt: "You are Cassi, ..."   # englisch formuliert, Antwortsprache wird ergänzt
  mood:                # frei benennbare Stimmungen, 0–10; fließen in den System-Prompt ein
    cheerful: 6
    curious: 5

tools:
  enabled: [open_project, close_project, send_to_claude, claude_status, look_at_screen,
            click_on_screen, scroll_screen, open_url, read_webpage, remember, forget, ssh_connect,
            control_window, use_keyboard, phpstorm, run_command, find_file, timer,
            system_control, operate_computer, calendar, adjust_settings, answer_claude]
  phpstorm:
    launcher: null       # null = Toolbox-Skript bzw. `phpstorm` im PATH
    config_dir: null     # null = neueste PhpStorm-Version (für "zuletzt geöffnete Projekte")
    use_mcp: true        # PhpStorms MCP-Server nutzen (Settings → Tools → MCP Server aktivieren)
    mcp_url: null        # null = automatisch finden, sonst z.B. http://127.0.0.1:64442 (/stream oder /sse)
    mcp_token: null      # nur nötig, wenn der Server im "restricted mode" läuft
  claude:
    transport: auto      # auto = in `cassi claude`-Sitzung (tmux) tippen, sonst Zwischenablage
    autostart: true      # keine Sitzung? Claude im Hintergrund starten (anhängen: `cassi claude`)
  screen:
    monitor: 1           # 1 = Hauptbildschirm, 0 = alle
    max_size: 1280       # Screenshot wird auf diese Kantenlänge verkleinert
  pointer:               # click_on_screen
    model: auto          # Bildmodell zum Orten; auto = 4B-Variante aus cassi setup, sonst llm.model; null = llm.model
    refine: true         # zweiter, genauerer Blick, wenn die Bedienungshilfen nichts bestätigen
    verify: true         # nach dem Klick Bildschirm vergleichen; ohne Änderung sagt Cassi das
    ocr: true            # Beschriftungen ohne Bedienungshilfen per Texterkennung finden (~0,3 s)
  computer:              # operate_computer: Cassi findet den Weg durch eine App selbst
    max_steps: 12        # so viele Züge (klicken, tippen …) je Aufgabe, dann hört Cassi auf
    learn: true          # funktionierende Wege merken (<data_dir>/solutions.json)
    model: null          # null = llm.model; auto = 4B-Variante (~1/3 schneller, wählt öfter falsch)
  calendar:
    hidden: []           # Kalender, die Cassi auslässt, z.B. ["Feiertage", "Geburtstage"]
  web:                   # read_webpage
    max_pages: 3         # höchstens so viele Bildschirme lesen (je ~8 s auf einem M2 Pro)
    max_steps: 4         # so oft darf Cassi auf der Seite scrollen/klicken, bis es das Gesuchte hat
    direct: true         # Seiten direkt per HTTP laden (unsichtbar, ~0,2 s; ohne Logins/JavaScript)
    browser_text: true   # Text aus dem Browser lesen (macOS, Bedienungshilfen, im Hintergrund)
    max_chars: 8000      # so viel Seitentext auf einmal (~4 Zeichen je Token), passende Abschnitte zuerst
    close_tabs: true     # im Hintergrund geöffnete Tabs nach der Anfrage wieder schließen
  ssh:
    config_file: null    # null = ~/.ssh/config (Windows: %USERPROFILE%\.ssh\config); nur diese Server
    terminal: auto       # auto | terminal | iterm (macOS) | windows-terminal | console (Windows)
  commands: {}           # run_command führt nur diese aus, z.B.:
  #   tests: {command: "composer test", cwd: "~/projects/shop", timeout_seconds: 600}
  #   deploy-staging: {command: "./bin/deploy staging", cwd: "~/projects/shop"}
  files:                 # find_file
    roots: []            # leer = Downloads, Schreibtisch, Dokumente
  notifications:         # von sich aus Bescheid sagen
    claude: true         # Claude (cassi claude) fertig oder wartet auf Freigabe
    claude_min_work_seconds: 20

privacy:
  # Keine Bildschirmaufnahme und keine Texterkennung, solange eine dieser Apps oder ein Fenster
  # mit einem dieser Titelwörter im aufgenommenen Bereich sichtbar ist (Teile zählen).
  private_apps: [1Password, Bitwarden, KeePass, Dashlane, LastPass, Enpass, Keychain Access,
                 Schlüsselbundverwaltung, Passwords, Passwörter]
  private_titles: [Online-Banking, Onlinebanking, Banking, Sparkasse, Volksbank, PayPal,
                   Kontoauszug, Privates Surfen, Private Browsing, Privates Fenster, InPrivate,
                   Inkognito, Incognito]
  history_days: 30     # Verlauf für `cassi history` / `cassi stats` (nur lokal); 0 = keiner

# Installierte Adapter, die Cassi personalisieren (z.B. flay); fehlt der Eintrag: alle.
# adapters: [flay]

ui:
  enabled: true        # lokale Web-UI: Chatverlauf, Texteingabe, Mikrofon/Sprache stumm
  port: 8765           # erreichbar nur unter http://127.0.0.1:8765
  open_browser: true
  tray: true           # Symbol in Menüleiste/Tray: Status, stumm schalten, UI, Beenden

updates:
  switch: true         # neuere installierte Version übernehmen (Hinweis im Chat, Neustart wenn frei)
  check_seconds: 60    # so oft prüfen; beim Entwickeln ggf. switch: false (sonst Neustart je Commit)

memory:
  enabled: true                 # Verlauf + Fakten in <data_dir>/memory.sqlite3 speichern
  recent_messages: 12           # so viele Nachrichten der Sitzung wörtlich, ältere zusammengefasst
  session_timeout_minutes: 30   # längere Pause = neue Sitzung (Fakten bleiben)
  summarize: true
  extract_facts: true           # LLM merkt sich dauerhafte Fakten ("merk dir ...")
  max_facts: 50
  idle_seconds: 3               # Hintergrundarbeit erst nach so viel Ruhe
  recall:                       # passende Erinnerungen je Anfrage suchen (RAG)
    enabled: true
    model: auto                 # qwen3-embedding:0.6b (Apache 2.0, ollama pull …), auto = 2k-Kontext-Variante aus setup
    base_url: null              # null = Server des LLM
    limit: 6                    # höchstens so viele Erinnerungen je Anfrage
    min_similarity: 0.30
    timeout_ms: 300             # länger wartet die Antwort nicht auf die Suche

# Persönliche Daten (Gedächtnis, Verlauf, eigene Modelle) – nie im Repository; mitnehmen oder
# sichern mit `cassi export` / `cassi import` (oder Tab „Daten“ in `cassi manage`).
# data_dir: ~/Library/Application Support/cassi   # Windows: %LOCALAPPDATA%\cassi
# downloads_dir: null   # heruntergeladene Modelle (Stimmen, VAD …); null = im data_dir

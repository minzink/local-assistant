# Beispiele für `flay eval --examples`: so wurden eigene Aufnahmen (eval/speech.yaml)
# von Whisper und Parakeet gehört, mit der gemeinten Aktion. Absichtlich andere Sätze als
# in eval/cases.yaml, damit gemessen wird, ob das Modell aus Beispielen verallgemeinert.

examples:
- say: Öffne das Projekt KX-Forms.
  tool: open_project
  arguments:
    name: project-symfony-kx-forms
- say: Schließe das Projekt KXEWO.
  tool: close_project
  arguments:
    name: project-symfony-kx-ewo
- say: Schließe KX-Command.
  tool: close_project
  arguments:
    name: component-symfony-kx-command
- say: Öffne das Projekt statt Wolkenthal.
  tool: open_project
  arguments:
    name: stadt-wolkenthal
- say: Mach mal Moewe auf.
  tool: open_project
  arguments:
    name: moewe
- say: Öffne das Projekt Symfony-kx-de-forms.
  tool: open_project
  arguments:
    name: project-symfony-kx-forms
- say: Sagt Claude im Projekt Flay, er soll die Readme zusammenfassen.
  tool: send_to_claude
  arguments:
    instruction: Fasse die README zusammen.
    project: flay
- say: Sagt Lord, er soll Tests für den Login-Controller schreiben.
  tool: send_to_claude
  arguments:
    instruction: Schreibe Tests für den Login-Controller.
- say: Fragt Claude im UMX-Projekt, warum der Bild fehlschlägt.

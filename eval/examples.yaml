- say: Schreibt Claude, er soll das symfony-formular für die Adresse anpassen.
  tool: send_to_claude
  arguments:
    instruction: Passe das Symfony-Formular für die Adresse an.
- say: Sagt Claude, er soll die Composer-Abhängigkeiten aktualisieren.
  tool: send_to_claude
  arguments:
    instruction: Aktualisiere die Composer-Abhängigkeiten.
- say: Ist Cloud schon fertig?
  tool: claude_status
  arguments: {}
- say: Schau dir mein PHP-Stormfenster an.
  tool: look_at_screen
  arguments:
    window: PhpStorm
- say: Was siehst du auf dem zweiten Bildschirm?
  tool: look_at_screen
  arguments:
    monitor: 2
- say: Open the project flay.
  tool: open_project
  arguments:
    name: flay
- say: Close the UMX project.
  tool: close_project
  arguments:
    name: umx
- say: Tell Claude to update the changelog.
  tool: send_to_claude
